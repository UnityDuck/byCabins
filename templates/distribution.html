<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Распределение по каютам</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h1 class="mb-4 text-center">🚀 Распределение астронавтов по каютам</h1>
        <div class="row row-cols-1 row-cols-md-2 g-4">
            {% for astronaut in astronauts %}
                <div class="col">
                    <div class="card text-white bg-primary h-100">
                        <div class="card-header">
                            Каюта №{{ loop.index }}
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">{{ astronaut }}</h5>
                            {% if loop.first %}
                                <p class="card-text">🧑‍✈️ Капитан корабля</p>
                            {% else %}
                                <p class="card-text">Экипаж</p>
                            {% endif %}
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
